name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/GLENT-VPN-Pitbike.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GLENT-VPN-Pitbike-APK
          path: build/GLENT-VPN-Pitbike.apk
