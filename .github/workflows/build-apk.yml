
name: GLENT VPN PITBIKE - Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmd.zip
          mkdir -p /tmp/cmd
          unzip -q /tmp/cmd.zip -d /tmp/cmd
          mv /tmp/cmd/cmdline-tools "$SDK/cmdline-tools/latest"

          export ANDROID_HOME="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --sdk_root="$SDK" --licenses || true

          sdkmanager --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install Godot 4.3
        run: |
          set -euo pipefail

          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip

          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot

          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          godot --version

      - name: Install Android export templates
        run: |
          set -euo pipefail

          DEST="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$DEST"

          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz

          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$DEST/"

          test -s "$DEST/android_debug.apk"
          test -s "$DEST/android_release.apk"

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"

          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android settings
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -f "$HOME/.android/debug.keystore"

      - name: Find and unpack game
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::ZIP archive not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/game"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/game"

          PROJECT_FILE="$(find "$RUNNER_TEMP/game" -type f -name project.godot -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::project.godot not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/export_presets.cfg"

      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail

          java -version
          godot --version

          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"

          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"

      - name: Import Godot project
        run: |
          set -euo pipefail

          godot --headless --editor \
            --path "$PROJECT_DIR" --import

          godot --headless --editor \
            --path "$PROJECT_DIR" --quit

      - name: Export Android APK
        shell: bash
        run: |
          godot --headless --verbose \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/GLENT-VPN-Pitbike.apk" \
            2>&1 | tee "$RUNNER_TEMP/export.log" || true

          echo "========== ANDROID EXPORT DIAGNOSTICS =========="

          grep -inE 'error|invalid|missing|android|sdk|keystore|java|preset' \
            "$RUNNER_TEMP/export.log" | tail -100 || true

          if [ ! -s "$PROJECT_DIR/build/GLENT-VPN-Pitbike.apk" ]; then
            echo "::error::APK was not created. See export diagnostics above."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GLENT-VPN-Pitbike-APK
          path: ${{ env.PROJECT_DIR }}/build/GLENT-VPN-Pitbike.apk
          if-no-files-found: error
          retention-days: 14
