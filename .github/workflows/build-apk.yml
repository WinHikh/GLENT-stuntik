name: GLENT VPN PITBIKE - Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip curl

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/android-tools.zip

          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools

          mv /tmp/android-tools/cmdline-tools \
            "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          export ANDROID_HOME="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --sdk_root="$SDK" --licenses || true

          sdkmanager --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Install Godot 4.3
        run: |
          set -euo pipefail

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -O /tmp/godot.zip

          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64

          sudo mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          godot --version

      - name: Install matching Android export templates
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O /tmp/templates.tpz

          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates

          cp -a /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

          echo "4.3.stable" > \
            "$HOME/.local/share/godot/export_templates/4.3.stable/version.txt"

          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"

      - name: Create Android debug signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$HOME/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Find and unpack game project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Game ZIP not found in repository root"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/game"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/game"

          PROJECT_FILE="$(find "$RUNNER_TEMP/game" -name project.godot -type f -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::project.godot not found in ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT_DIR"

      - name: Check Android tools
        run: |
          set -euo pipefail

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"

          java -version
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Import Godot project
        run: |
          set -euo pipefail
          godot --headless --editor --path "$PROJECT_DIR" --import
          godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"

          mkdir -p "$PROJECT_DIR/build"

          godot --headless --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/GLENT-VPN-Pitbike.apk"

          test -s "$PROJECT_DIR/build/GLENT-VPN-Pitbike.apk"

      - name: Upload finished APK
        uses: actions/upload-artifact@v4
        with:
          name: GLENT-VPN-Pitbike-APK
          path: ${{ env.PROJECT_DIR }}/build/GLENT-VPN-Pitbike.apk
          if-no-files-found: error
          retention-days: 14
