name: Build GLENT VPN PITBIKE APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unpack project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::ZIP archive not found"
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PROJECT_FILE="$(find source -type f -name project.godot -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::project.godot not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/build"
          godot --headless --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/GLENT-VPN-Pitbike.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GLENT-VPN-Pitbike-APK
          path: source/**/build/GLENT-VPN-Pitbike.apk
          if-no-files-found: error
          retention-days: 14
