name: GLENT VPN PITBIKE - Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip python3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/android-cmdline.zip

          mkdir -p /tmp/android-cmdline
          unzip -q /tmp/android-cmdline.zip -d /tmp/android-cmdline

          mv /tmp/android-cmdline/cmdline-tools \
            "$SDK/cmdline-tools/latest"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --sdk_root="$SDK" --licenses || true

          sdkmanager --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$SDK/ndk/23.2.8568313"
            echo "ANDROID_NDK_ROOT=$SDK/ndk/23.2.8568313"
          } >> "$GITHUB_ENV"

          {
            echo "$SDK/platform-tools"
            echo "$SDK/cmdline-tools/latest/bin"
          } >> "$GITHUB_PATH"

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -O /tmp/godot.zip

          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot.zip -d /tmp/godot-bin

          chmod +x /tmp/godot-bin/Godot_v4.3-stable_linux.x86_64

          sudo install \
            /tmp/godot-bin/Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot

          godot --version

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O /tmp/godot-templates.tpz

          mkdir -p /tmp/godot-templates

          unzip -q /tmp/godot-templates.tpz \
            -d /tmp/godot-templates

          DEST="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$DEST"

          for FILE in \
            android_debug.apk \
            android_release.apk \
            android_source.zip
          do
            SOURCE="$(find /tmp/godot-templates \
              -type f -name "$FILE" -print -quit)"

            if [ -z "$SOURCE" ]; then
              echo "::error::Missing export template: $FILE"
              find /tmp/godot-templates -maxdepth 4 -type f
              exit 1
            fi

            cp "$SOURCE" "$DEST/$FILE"
            test -s "$DEST/$FILE"
          done

          printf '4.3.stable\n' > "$DEST/version.txt"

          echo "Installed templates:"
          ls -lh "$DEST"

          test -s "$DEST/android_debug.apk"
          test -s "$DEST/android_release.apk"
          test -s "$DEST/android_source.zip"
          test -s "$DEST/version.txt"

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android

      - name: Locate and unpack project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/game"

          PROJECT_FILE="$(find . \
            -type f -name project.godot \
            -not -path './.git/*' \
            -print -quit || true)"

          if [ -z "$PROJECT_FILE" ]; then
            while IFS= read -r ZIP_FILE; do
              TEMP_DIR="$(mktemp -d)"

              if unzip -q "$ZIP_FILE" -d "$TEMP_DIR"; then
                PROJECT_FILE="$(find "$TEMP_DIR" \
                  -type f -name project.godot \
                  -print -quit || true)"

                if [ -n "$PROJECT_FILE" ]; then
                  cp -a "$TEMP_DIR/." "$RUNNER_TEMP/game/"
                  PROJECT_FILE="$(find "$RUNNER_TEMP/game" \
                    -type f -name project.godot -print -quit)"
                  break
                fi
              fi

              rm -rf "$TEMP_DIR"
            done < <(find . -type f -iname '*.zip' \
              -not -path './.git/*' | sort)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Cannot find project.godot in repository or ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Selected project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

          test -f "$PROJECT_DIR/project.godot"

      - name: Configure Godot 4.3 editor settings
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_DIR="$HOME/.config/godot"
          mkdir -p "$SETTINGS_DIR"

          cat > "$SETTINGS_DIR/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "Godot Editor Settings:"
          cat "$SETTINGS_DIR/editor_settings-4.3.tres"

          test -d "$JAVA_HOME"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -s "$HOME/.android/debug.keystore"

      - name: Repair Android export preset
        shell: bash
        run: |
          set -euo pipefail

          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          version/code=1
          version/name="1.0"
          package/unique_name="com.glentvpn.pitbikestunt"
          package/name="GLENT VPN PITBIKE STUNT"
          package/signed=true
          screen/immersive_mode=true
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF

          echo "Android preset:"
          cat "$PROJECT_DIR/export_presets.cfg"

      - name: Configure ETC2 ASTC texture import
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR/project.godot" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text()

          setting = "textures/vram_compression/import_etc2_astc=true"

          if setting in content:
              print("ETC2/ASTC already enabled")
              raise SystemExit(0)

          lines = content.splitlines()
          start = None
          end = len(lines)

          for i, line in enumerate(lines):
              if line.strip() == "[rendering]":
                  start = i
                  break

          if start is None:
              lines.extend(["", "[rendering]", setting])
          else:
              for i in range(start + 1, len(lines)):
                  if lines[i].strip().startswith("["):
                      end = i
                      break
              lines.insert(end, setting)

          path.write_text("\n".join(lines) + "\n")
          print("ETC2/ASTC enabled")
          PY

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --editor \
            --path "$PROJECT_DIR" \
            --import

      - name: Validate Android configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Godot:"
          godot --version

          echo "Java:"
          java -version

          echo "Android SDK:"
          adb version

          echo "Templates:"
          ls -lh "$HOME/.local/share/godot/export_templates/4.3.stable"

          echo "Editor settings:"
          ls -lh "$HOME/.config/godot/editor_settings-4.3.tres"

          echo "Project:"
          test -f "$PROJECT_DIR/project.godot"
          test -s "$PROJECT_DIR/export_presets.cfg"

          echo "Keystore:"
          test -s "$HOME/.android/debug.keystore"

          echo "Configuration checks passed."

      - name: Export Android APK
        shell: bash
        run: |
          set -uo pipefail

          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"

          mkdir -p "$PROJECT_DIR/build"

          LOG="$RUNNER_TEMP/godot-export.log"

          set +e

          godot --headless --verbose \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/GLENT-VPN-Pitbike.apk" \
            2>&1 | tee "$LOG"

          RESULT=${PIPESTATUS[0]}

          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Godot Android export failed"

            echo "===== GODOT DIAGNOSTICS ====="

            grep -inE \
              'error|invalid|missing|android|sdk|keystore|java|preset|template' \
              "$LOG" | tail -150 || true

            exit "$RESULT"
          fi

          if [ ! -s "$PROJECT_DIR/build/GLENT-VPN-Pitbike.apk" ]; then
            echo "::error::APK was not created"
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$PROJECT_DIR/build/GLENT-VPN-Pitbike.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLENT-VPN-Pitbike-APK
          path: ${{ env.PROJECT_DIR }}/build/GLENT-VPN-Pitbike.apk
          if-no-files-found: error
          retention-days: 14
